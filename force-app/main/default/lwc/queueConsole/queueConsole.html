<template>
    <div class="cq-page">
        <div class="cq-card">
            <div class="cq-header">
                <div class="cq-header-left">
                    <div class="cq-header-icon">
                        <lightning-icon icon-name="standard:queue" size="small" variant="inverse"></lightning-icon>
                    </div>
                    <div>
                        <h1 class="cq-title">Live Queue</h1>
                        <p class="cq-subtitle">
                            <span class="cq-live-dot"></span>
                            Updates in real time
                        </p>
                    </div>
                </div>
            </div>

            <div class="cq-filters">
                <div class="cq-field">
                    <lightning-combobox
                        label="Doctor"
                        value={selectedDoctorId}
                        options={doctorOptions}
                        onchange={handleDoctorChange}
                    ></lightning-combobox>
                </div>
                <div class="cq-field">
                    <lightning-input
                        type="date"
                        label="Date"
                        value={selectedDate}
                        onchange={handleDateChange}
                    ></lightning-input>
                </div>
            </div>

            <template if:true={isLoading}>
                <div class="cq-loading-bar"></div>
            </template>

            <template if:true={hasQueueItems}>
                <div class="cq-queue-list">
                    <template for:each={queueItems} for:item="item">
                        <div key={item.id} class={item.rowClass} style={item.rowStyle}>
                            <div class="cq-position">{item.positionInQueue}</div>
                            <div class="cq-patient-info">
                                <p class="cq-patient-name">{item.patientName}</p>
                                <p class="cq-patient-meta">{item.patientPhone} &middot; Slot {item.slotTime}</p>
                            </div>
                            <span class={item.statusClass}>{item.status}</span>
                            <div class="cq-actions">
                                <template if:true={item.isBooked}>
                                    <button type="button" class="cq-btn cq-btn-primary" data-id={item.id} onclick={handleCheckIn}>Check In</button>
                                    <button type="button" class="cq-btn cq-btn-ghost-danger" data-id={item.id} onclick={handleSkip}>Skip</button>
                                </template>
                                <template if:true={item.isCheckedIn}>
                                    <button type="button" class="cq-btn cq-btn-success" data-id={item.id} onclick={handleCheckOut}>Check Out</button>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
            <template if:false={hasQueueItems}>
                <div class="cq-empty">
                    <lightning-icon icon-name="utility:date_time" size="small" class="cq-empty-icon"></lightning-icon>
                    <p>No appointments for this doctor on this date.</p>
                </div>
            </template>
        </div>
    </div>
</template>
