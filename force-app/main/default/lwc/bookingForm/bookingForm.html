<template>
    <div class="cq-page">
        <div class="cq-card">
            <div class="cq-header">
                <div class="cq-header-icon">
                    <lightning-icon icon-name="standard:events" size="small" variant="inverse"></lightning-icon>
                </div>
                <div>
                    <h1 class="cq-title">Book an Appointment</h1>
                    <p class="cq-subtitle">Pick a doctor, date, and open slot</p>
                </div>
            </div>

            <div class="cq-body">
                <template if:true={errorMessage}>
                    <div class="cq-alert cq-alert-error">
                        <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
                        <span>{errorMessage}</span>
                    </div>
                </template>

                <template if:true={confirmation}>
                    <div class="cq-alert cq-alert-success">
                        <lightning-icon icon-name="utility:success" size="x-small" variant="success"></lightning-icon>
                        <div>
                            <p class="cq-alert-title">{confirmation}</p>
                            <p class="cq-alert-ref">Reference: <span class="cq-mono">{confirmedAppointmentId}</span></p>
                        </div>
                    </div>
                </template>

                <div class="cq-field-row">
                    <div class="cq-field">
                        <lightning-combobox
                            label="Doctor"
                            value={selectedDoctorId}
                            options={doctorOptions}
                            onchange={handleDoctorChange}
                        ></lightning-combobox>
                    </div>
                    <div class="cq-field">
                        <lightning-input
                            type="date"
                            label="Date"
                            value={selectedDate}
                            onchange={handleDateChange}
                        ></lightning-input>
                    </div>
                </div>

                <template if:true={hasSlots}>
                    <p class="cq-section-label">Available times</p>
                    <div class="cq-slot-grid">
                        <template for:each={slots} for:item="slot">
                            <button
                                key={slot.key}
                                type="button"
                                class={slot.className}
                                style={slot.style}
                                data-value={slot.value}
                                disabled={slot.disabled}
                                onclick={handleSlotClick}
                            >{slot.label}</button>
                        </template>
                    </div>
                </template>
                <template if:false={hasSlots}>
                    <p class="cq-empty-inline">No open slots for this doctor on this date.</p>
                </template>

                <template if:true={selectedSlotLabel}>
                    <div class="cq-selected-chip">
                        <lightning-icon icon-name="utility:clock" size="xx-small"></lightning-icon>
                        <span>Selected: <strong>{selectedSlotLabel}</strong></span>
                    </div>
                </template>

                <div class="cq-divider"></div>

                <p class="cq-section-label">Your details</p>
                <div class="cq-field-row">
                    <div class="cq-field">
                        <lightning-input
                            label="Patient Name"
                            value={patientName}
                            onchange={handleNameChange}
                        ></lightning-input>
                    </div>
                    <div class="cq-field">
                        <lightning-input
                            label="Patient Phone"
                            type="tel"
                            value={patientPhone}
                            onchange={handlePhoneChange}
                        ></lightning-input>
                    </div>
                </div>

                <button
                    type="button"
                    class="cq-submit-btn"
                    disabled={isSubmitDisabled}
                    onclick={handleSubmit}
                >
                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Booking" size="x-small" variant="inverse"></lightning-spinner>
                    </template>
                    <template if:false={isLoading}>Book Appointment</template>
                </button>
            </div>
        </div>
    </div>
</template>
